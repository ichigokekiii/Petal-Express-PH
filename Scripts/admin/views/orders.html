<div class="px-4">
  <!-- Page Title and Actions -->
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-bold text-[#27334B]">Orders list</h2>
    <div class="flex items-center gap-2">
      <button class="px-4 py-2 rounded-full bg-white text-[#536FA3] border hover:bg-[#F4FAFF]">Sort By</button>
      <button class="px-4 py-2 rounded-full bg-white text-[#536FA3] border hover:bg-[#F4FAFF]">Filter By</button>
      <button class="px-4 py-2 rounded-full bg-[#5977AF] text-white">Add Orders +</button>
    </div>
  </div>

  <!-- Content Card -->
  <div class="rounded-2xl bg-white shadow-sm border p-4">
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="text-[#536FA3]">
            <th class="py-2 px-3 text-left">Order ID</th>
            <th class="py-2 px-3 text-left">User</th>
            <th class="py-2 px-3 text-left">Items</th>
            <th class="py-2 px-3 text-left">Amount</th>
            <th class="py-2 px-3 text-left">Status</th>
            <th class="py-2 px-3 text-left">Placed</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="o in orders" class="border-t">
            <td class="py-2 px-3">{{o.OrderId}}</td>
            <td class="py-2 px-3">{{o.UserId}}</td>
            <td class="py-2 px-3">{{o.ItemCount}}</td>
            <td class="py-2 px-3">${{o.OrderAmount | number:2}}</td>
            <td class="py-2 px-3">{{o.OrderStatus}}</td>
            <td class="py-2 px-3">{{formatDate(o.CreatedAt)}}</td>
          </tr>
          <tr ng-if="!orders || orders.length===0">
            <td colspan="6" class="py-4 text-center text-[#536FA3]">No orders found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
