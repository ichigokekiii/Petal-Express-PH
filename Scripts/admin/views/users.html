<div class="card">
  <div class="card-body">
    <h5 class="card-title">Users</h5>
    <table class="table table-sm">
      <thead><tr><th>ID</th><th>Email</th><th>Name</th><th>Phone</th></tr></thead>
      <tbody>
        <tr ng-repeat="u in users">
          <td>{{u.userId || u.user_id}}</td>
          <td>{{u.email}}</td>
          <td>{{u.firstName}} {{u.lastName}}</td>
          <td>{{u.phoneNumber}}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
