<div class="px-4">
  <!-- Stats Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="rounded-2xl bg-white border shadow-sm p-4" ng-repeat="s in stats">
      <div class="text-[#536FA3] text-sm">{{s.title}}</div>
      <div class="text-2xl font-bold text-[#27334B] mt-1">{{s.value}}</div>
      <div class="text-xs text-green-600">{{s.delta}}</div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <div class="lg:col-span-2 rounded-2xl bg-white border shadow-sm p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-[#27334B]">Recent Orders</h3>
        <div class="flex gap-2">
          <button class="px-3 py-1 rounded-full bg-white text-[#536FA3] border">Sort By</button>
          <button class="px-3 py-1 rounded-full bg-white text-[#536FA3] border">Filter By</button>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="text-[#536FA3]"><th class="py-2 px-3 text-left">ID</th><th class="py-2 px-3 text-left">Customer</th><th class="py-2 px-3 text-left">Items</th><th class="py-2 px-3 text-left">Total</th><th class="py-2 px-3 text-left">Status</th></tr>
          </thead>
          <tbody>
            <tr ng-repeat="o in recentOrders" class="border-t">
              <td class="py-2 px-3">{{o.Id}}</td>
              <td class="py-2 px-3">{{o.Customer}}</td>
              <td class="py-2 px-3">{{o.Items}}</td>
              <td class="py-2 px-3">?{{o.Total}}</td>
              <td class="py-2 px-3">{{o.Status}}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="rounded-2xl bg-white border shadow-sm p-4">
      <h3 class="font-bold text-[#27334B] mb-2">Top Products</h3>
      <ul class="space-y-2 text-sm">
        <li>?? Rose Bouquet — 120 sold</li>
        <li>?? Sunflower Mix — 80 sold</li>
        <li>?? Orchid Box — 60 sold</li>
      </ul>
    </div>
  </div>
</div>
