<div class="card">
  <div class="card-body">
    <h4>Settings</h4>
    <form ng-submit="save()">
      <div class="mb-3">
        <label class="form-label">Store Name</label>
        <input class="form-control" ng-model="store.name" />
      </div>
      <div class="mb-3">
        <label class="form-label">Timezone</label>
        <select class="form-select" ng-model="store.timezone">
          <option>Asia/Manila</option>
          <option>UTC</option>
        </select>
      </div>
      <button class="btn btn-danger" type="submit">Save</button>
    </form>
  </div>
</div>
