<div class="p-4" ng-controller="ProductsCtrl">
  <div class="flex items-center justify-between mb-3">
    <h3 class="font-bold text-[#27334B]">Products</h3>
    <button class="px-3 py-1 rounded-full bg-[#5977AF] text-white text-sm font-bold" ng-click="openCreate()">Add Product</button>
  </div>
  <div class="rounded-2xl bg-white border shadow-sm p-4">
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="text-[#536FA3]"><th class="py-2 px-3 text-left">ID</th><th class="py-2 px-3 text-left">Name</th><th class="py-2 px-3 text-left">Price</th><th class="py-2 px-3 text-left">Category</th><th class="py-2 px-3 text-left">Created</th><th class="py-2 px-3 text-left">Actions</th></tr>
        </thead>
        <tbody>
          <tr ng-repeat="p in products" class="border-t">
            <td class="py-2 px-3">{{p.ProductId}}</td>
            <td class="py-2 px-3">{{p.Name}}</td>
            <td class="py-2 px-3">? {{p.Price | number:2}}</td>
            <td class="py-2 px-3">{{p.CategoryId}}</td>
            <td class="py-2 px-3">{{formatDate(p.CreatedAt)}}</td>
            <td class="py-2 px-3">
              <button class="px-2 py-1 text-xs rounded-full bg-[#DFEDF9] text-[#27334B]" ng-click="openEdit(p)">Edit</button>
            </td>
          </tr>
          <tr ng-if="!products || products.length===0"><td colspan="6" class="py-4 text-center text-[#536FA3]">No products found.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Create/Edit Product Modal (inside controller scope) -->
  <div class="fixed inset-0 flex items-center justify-center" ng-show="showModal" style="z-index:1000;">
    <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-2xl border">
      <div class="flex justify-between items-start">
        <h2 class="text-xl font-semibold mb-2 text-[#27334B]">{{isEdit ? 'Edit Product' : 'Add New Product'}}</h2>
        <button class="text-gray-500" ng-click="cancel()">?</button>
      </div>

      <p class="text-sm text-gray-500 mb-4">Product Information</p>

      <form ng-submit="submit()" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm text-gray-600 mb-1">Name</label>
          <input class="w-full p-2 border-b border-gray-300 focus:border-[#5977AF] outline-none" ng-model="form.Name" required />
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Price</label>
          <input type="number" min="0" step="0.01" class="w-full p-2 border-b border-gray-300 focus:border-[#5977AF] outline-none" ng-model="form.Price" required />
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Category</label>
          <select class="w-full p-2 border-b border-gray-300 focus:border-[#5977AF] outline-none" ng-model="form.CategoryId">
            <option value="">Select category</option>
            <option value="1">Bouquets</option>
            <option value="2">Arrangements</option>
            <option value="3">Boxes</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Quantity Check</label>
          <input type="number" min="0" class="w-full p-2 border-b border-gray-300 focus:border-[#5977AF] outline-none" ng-model="form.CheckQuantity" />
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm text-gray-600 mb-1">Description</label>
          <textarea class="w-full p-2 border-b border-gray-300 focus:border-[#5977AF] outline-none" ng-model="form.Description"></textarea>
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm text-gray-600 mb-1">Image</label>
          <input type="file" class="w-full" onchange="angular.element(this).scope().onImageSelected(this)" />
          <p class="text-xs text-gray-500 mt-1" ng-if="form.ImageId">Uploaded (Image Id: {{form.ImageId}})</p>
        </div>
        <div class="md:col-span-2 flex items-center justify-between mt-2">
          <label class="inline-flex items-center gap-2 text-sm text-gray-600">
            <input type="checkbox" ng-model="form.IsArchive" />
            <span>Archive</span>
          </label>
          <div class="flex gap-2">
            <button type="button" class="px-6 py-2 rounded-full bg-gray-200 text-[#27334B] font-bold" ng-click="cancel()">Cancel</button>
            <button type="submit" class="px-6 py-2 rounded-full bg-[#5977AF] text-white font-bold">{{isEdit ? 'Edit Product' : 'Create Product'}}</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
